<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>水下生物圖鑑｜DiveInOut</title>
<meta name="description" content="選你的程度和要去的地方，看看下水會遇到誰。">
<style>
:root{--ink:#e9fbff;--dim:#8fb3bf;--accent:#2ff3e0;--edge:rgba(47,243,224,.28);--card:rgba(255,255,255,.045)}
*{box-sizing:border-box;margin:0;padding:0}html{background:#020a10;scroll-behavior:smooth}
body{min-width:0;overflow-x:hidden;background:#020a10;color:var(--ink);font-family:"PingFang TC","Noto Sans TC",-apple-system,"Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}body.modal-open{overflow:hidden}
button,select{font:inherit}button{cursor:pointer}a{color:var(--accent);text-decoration:none}.mono{font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace}.wrap{width:min(1440px,100%);margin:0 auto;padding-inline:24px}
.page-head{padding-block:28px 42px;background:radial-gradient(80% 150% at 82% -30%,rgba(47,243,224,.13),transparent 60%),#020a10}.back{display:inline-flex;align-items:center;min-height:36px;margin-bottom:20px;font-size:13px;font-weight:800;letter-spacing:1px}.lab{display:flex;align-items:center;gap:12px;margin-bottom:9px;color:var(--accent);font-size:12px;font-weight:800;letter-spacing:3px}.lab:before{content:"";width:34px;height:2px;background:var(--accent)}
h1{font-size:clamp(42px,7vw,76px);font-weight:900;line-height:1.05;letter-spacing:-.01em}.intro{max-width:620px;margin-top:12px;color:var(--dim);font-size:15px;line-height:1.75}
.filters{position:sticky;top:0;z-index:30;border-block:1px solid rgba(255,255,255,.09);background:rgba(2,10,16,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.filters-inner{display:flex;align-items:center;gap:18px;min-height:64px}.filter-group{display:flex;align-items:center;gap:8px;min-width:0}.filter-label{flex:0 0 auto;color:var(--dim);font-size:11px;font-weight:800;letter-spacing:1px;white-space:nowrap}.chip-track{display:flex;gap:6px;min-width:0;overflow-x:auto;padding:3px 1px;scrollbar-width:none}.chip-track::-webkit-scrollbar{display:none}
.filter-chip{flex:0 0 auto;min-height:32px;padding:5px 11px;border:1px solid rgba(255,255,255,.15);border-radius:99px;background:transparent;color:var(--ink);font-size:12px;font-weight:800;white-space:nowrap;transition:.18s}.filter-chip:hover{border-color:var(--edge);background:rgba(47,243,224,.07)}.filter-chip.active{border-color:var(--accent);background:var(--accent);color:#04202c;box-shadow:0 0 16px rgba(47,243,224,.15)}
select{min-height:34px;max-width:150px;padding:5px 30px 5px 10px;border:1px solid rgba(255,255,255,.16);border-radius:8px;background:#08202b;color:var(--ink);color-scheme:dark}.filter-status{display:flex;align-items:center;gap:10px;margin-left:auto;white-space:nowrap}.result-count{color:var(--dim);font-size:12px;font-weight:800}.result-count strong{color:var(--accent)}.clear{display:none;padding:6px 0;border:0;background:none;color:var(--accent);font-size:12px;font-weight:900}.clear.show{display:inline-block}
.atlas{display:grid;grid-template-columns:68px minmax(0,1fr);gap:28px;padding-block:36px 80px}.depth-rail{position:relative}.rail-inner{position:sticky;top:100px;height:360px;margin-top:28px}.rail-line{position:absolute;top:11px;bottom:11px;left:10px;width:1px;background:rgba(143,179,191,.32)}.rail-mark{position:absolute;left:0;display:flex;align-items:center;gap:9px;border:0;background:none;color:var(--dim);font:700 11px "SFMono-Regular",ui-monospace,monospace;white-space:nowrap;transform:translateY(-50%)}.rail-mark:before{content:"";width:7px;height:7px;border:1px solid var(--dim);border-radius:50%;background:#020a10;transition:.2s}.rail-mark.active{color:var(--accent)}.rail-mark.active:before{border-color:var(--accent);background:var(--accent);box-shadow:0 0 13px var(--accent)}.rail-mark[data-level="snorkel"]{top:3%}.rail-mark[data-level="owd"]{top:43%}.rail-mark[data-level="aowd"]{top:70%}.rail-mark[data-level="beyond"]{top:97%}
.sections{min-width:0}.level-section{scroll-margin-top:86px;padding:24px 0 46px}.section-title{display:flex;align-items:center;gap:14px}.section-title .depth-label{color:var(--accent);font-size:11px;font-weight:900;letter-spacing:.08em;white-space:nowrap}.section-title h2{font-size:clamp(23px,3vw,34px);font-weight:900;line-height:1.08;letter-spacing:-.01em;white-space:nowrap}.section-title:after{content:"";width:100%;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}.section-desc{margin:9px 0 20px;color:var(--dim);font-size:13px;line-height:1.7}
.creature-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.creature-card{display:block;min-width:0;overflow:hidden;border:1px solid rgba(255,255,255,.1);border-radius:14px;background:var(--card);color:var(--ink);text-align:left;transition:border-color .2s,background .2s,transform .2s,box-shadow .2s}.creature-card:hover{border-color:var(--edge);background:rgba(47,243,224,.06);transform:translateY(-2px)}.creature-card:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.art-panel{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;overflow:hidden}.art-panel[data-level="snorkel"]{background:linear-gradient(160deg,#0f5566,#0a3a4a)}.art-panel[data-level="owd"]{background:linear-gradient(160deg,#0b4050,#082c3a)}.art-panel[data-level="aowd"]{background:linear-gradient(160deg,#083040,#061f2b)}.art-panel[data-level="beyond"]{background:linear-gradient(160deg,#061a24,#030d14)}.art-panel svg{width:60%;height:60%;overflow:visible;color:var(--accent);filter:drop-shadow(0 7px 12px rgba(0,0,0,.25));transition:transform .25s ease}.art-panel svg path,.art-panel svg circle,.art-panel svg ellipse{fill:currentColor}.art-panel svg .cut{fill:#062633}.art-panel img{width:100%;height:100%;object-fit:cover;transition:transform .25s ease}.creature-card:hover .art-panel svg,.creature-card:hover .art-panel img{transform:translateY(-4px)}
.level-badge{position:absolute;z-index:2;top:10px;right:10px;padding:4px 7px;border:1px solid rgba(233,251,255,.25);border-radius:99px;background:rgba(2,10,16,.64);color:var(--ink);font-size:10px;font-weight:900;letter-spacing:.03em}.card-body{display:block;padding:13px 14px 15px}.card-body>span{display:block}.card-name{overflow:hidden;font-size:16px;font-weight:900;line-height:1.25;letter-spacing:-.01em;text-overflow:ellipsis;white-space:nowrap}.card-en{margin-top:3px;overflow:hidden;color:var(--dim);font-size:11px;line-height:1.4;text-overflow:ellipsis;white-space:nowrap}.card-meta{margin-top:9px;color:var(--dim);font-size:12px;line-height:1.45}.card-spots{margin-top:5px;overflow:hidden;color:#bad3dc;font-size:12px;line-height:1.45;text-overflow:ellipsis;white-space:nowrap}
.empty{display:none;padding:70px 20px 100px;color:var(--dim);text-align:center;line-height:1.8}.empty.show{display:block}.empty .filter-chip{display:block;margin:17px auto 0;color:#04202c;background:var(--accent);border-color:var(--accent)}.load-error{padding:90px 20px;color:var(--dim);text-align:center;line-height:1.8}
.dialog .level-badge{left:14px;right:auto;top:14px}.modal-layer{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:22px;visibility:hidden;opacity:0;background:rgba(0,5,9,.72);transition:opacity .2s,visibility .2s}.modal-layer.open{visibility:visible;opacity:1}.dialog{position:relative;width:min(560px,100%);max-height:min(88dvh,820px);overflow:auto;border:1px solid var(--edge);border-radius:18px;background:#06141c;box-shadow:0 28px 80px rgba(0,0,0,.65);transform:translateY(10px);transition:transform .24s}.modal-layer.open .dialog{transform:none}.dialog .art-panel{aspect-ratio:16/8.4}.dialog .art-panel svg{width:48%;height:62%}.modal-close{position:absolute;z-index:5;top:12px;right:12px;width:38px;height:38px;border:1px solid rgba(255,255,255,.2);border-radius:50%;background:rgba(2,10,16,.75);color:var(--ink);font-size:25px;line-height:1}.modal-close:hover{border-color:var(--accent);color:var(--accent)}.dialog-content{padding:24px 26px 30px}.dialog-name{padding-right:36px;font-size:clamp(27px,5vw,38px);font-weight:900;line-height:1.08;letter-spacing:-.01em}.dialog-en{margin-top:4px;color:var(--dim);font-size:12px;letter-spacing:.03em}.dialog-meta{margin-top:11px;color:#c3dbe3;font-size:13px;line-height:1.55}.detail-block{margin-top:23px}.detail-block h3{margin-bottom:7px;color:var(--accent);font-size:13px;font-weight:900;letter-spacing:.04em}.detail-block p{color:#d5e9ee;font-size:14px;line-height:1.8}.review{margin-left:6px;color:#ffca7a;font-size:11px;font-weight:900;white-space:nowrap}.tip-box{padding:14px 15px;border:1px solid rgba(47,243,224,.2);border-radius:10px;background:rgba(47,243,224,.075)}.spot-chips{display:flex;flex-wrap:wrap;gap:7px}.spot-link{padding:6px 9px;border:1px solid var(--edge);border-radius:99px;color:var(--accent);font-size:11px;font-weight:800;transition:.18s}.spot-link:hover{background:rgba(47,243,224,.1);border-color:var(--accent)}.no-spots{color:var(--dim);font-size:13px}footer{padding:0 24px 58px;color:var(--dim);font-size:11px;text-align:center;line-height:1.7}
.rail-mark[data-rail-level="snorkel"]{top:3%}.rail-mark[data-rail-level="owd"]{top:43%}.rail-mark[data-rail-level="aowd"]{top:70%}.rail-mark[data-rail-level="beyond"]{top:97%}
@media(max-width:1100px){.creature-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:959px){.wrap{padding-inline:18px}.page-head{padding-block:20px 34px}.filters{position:static}.filters-inner{display:grid;grid-template-columns:1fr;gap:7px;padding-block:9px}.filter-group{height:38px}.filter-label{flex-basis:66px}.filter-group .chip-track{flex:1}.filter-status{width:100%;min-height:34px;margin-left:0;padding-left:74px}.atlas{display:block;padding-top:22px}.depth-rail{display:none}.level-section{scroll-margin-top:10px}}
@media(max-width:620px){.wrap{padding-inline:12px}.page-head{padding-inline:4px}h1{font-size:42px}.intro{font-size:14px}.filter-status{padding-left:74px}.creature-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.level-section{padding:20px 0 35px}.section-title{gap:8px}.section-title h2{font-size:18px}.section-title .depth-label{font-size:9px}.section-desc{font-size:12px}.card-body{padding:11px 10px 13px}.card-name{font-size:15px}.card-meta,.card-spots{font-size:11px}.level-badge{top:7px;right:7px}.modal-layer{align-items:end;padding:0}.dialog{width:100%;max-height:85dvh;border-width:1px 0 0;border-radius:18px 18px 0 0;transform:translateY(35px)}.dialog .art-panel{aspect-ratio:16/8.8}.dialog-content{padding:21px 18px max(28px,env(safe-area-inset-bottom))}}
</style>
</head>
<body>
<header class="page-head"><div class="wrap"><a class="back mono" href="../">← DiveInOut</a><div class="lab mono">CREATURE GUIDE / 生物圖鑑</div><h1>水下生物圖鑑</h1><p class="intro">選你的程度和要去的地方，看看下水會遇到誰。</p></div></header>
<section class="filters" aria-label="生物篩選"><div class="filters-inner wrap">
  <div class="filter-group"><div class="filter-label mono">我的程度</div><div class="chip-track" role="group" aria-label="程度"><button class="filter-chip active" type="button" data-filter-level="">全部</button><button class="filter-chip" type="button" data-filter-level="snorkel">只浮潛</button><button class="filter-chip" type="button" data-filter-level="owd">OWD</button><button class="filter-chip" type="button" data-filter-level="aowd">AOWD</button></div></div>
  <div class="filter-group"><label class="filter-label mono" for="region">我要去</label><select id="region"><option value="">全部地區</option><option value="okinawa">沖繩</option><option value="taiwan">台灣</option><option value="philippines">菲律賓</option><option value="palau">帛琉</option><option value="indonesia">印尼</option><option value="thailand">泰國</option><option value="malaysia">馬來西亞</option><option value="maldives">馬爾地夫</option><option value="egypt">埃及</option></select></div>
  <div class="filter-status"><div class="result-count" id="resultCount">載入中…</div><button class="clear" id="clearFilters" type="button">清除篩選</button></div>
</div></section>
<main class="atlas wrap"><aside class="depth-rail" aria-label="深度快速導覽"><div class="rail-inner"><div class="rail-line"></div><button class="rail-mark active" type="button" data-rail-level="snorkel">0m</button><button class="rail-mark" type="button" data-rail-level="owd">18m</button><button class="rail-mark" type="button" data-rail-level="aowd">30m</button><button class="rail-mark" type="button" data-rail-level="beyond">40m+</button></div></aside><div class="sections" id="sections"><div class="load-error">正在載入生物圖鑑…</div></div></main>
<div class="empty" id="emptyState">這個組合沒有收錄的生物。試試放寬程度或地區？<button class="filter-chip" type="button" data-clear>清除篩選</button></div>
<footer>生態資訊供參考，實際遇見依海況與運氣。季節或開放狀態標註「需覆核」者，請在出發前再次確認。</footer>
<div class="modal-layer" id="modalLayer" aria-hidden="true"><section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogName" tabindex="-1"><button class="modal-close" type="button" aria-label="關閉詳細資料">×</button><div id="dialogBody"></div></section></div>
<script>
const REGIONS=new Set(["okinawa","taiwan","philippines","palau","indonesia","thailand","malaysia","maldives","egypt"]),LEVEL_ORDER=["snorkel","owd","aowd","beyond"];
const LEVEL_INFO={snorkel:{depth:"0–5m",title:"浮潛就看得到",desc:"不用證照，戴上面鏡就能見面。",badge:"浮潛"},owd:{depth:"5–18m",title:"OWD 18m 內",desc:"拿到初級證照，這些都是你的主場。",badge:"OWD"},aowd:{depth:"18–30m",title:"AOWD 30m 內",desc:"進階深度與洋流，大傢伙開始登場。",badge:"AOWD"},beyond:{depth:"40m+",title:"休閒潛水看不到",desc:"用知識潛入就好。",badge:"—"}};
// 原有 16 種與新增 6 種，皆為 100 × 100 單色幾何剪影。

const esc=value=>String(value??"").replace(/[&<>\"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const state={level:null,region:null};let creatures=[],levels={},spotById=new Map(),regionBySpot=new Map(),lastTrigger=null,currentCreature=null,sectionObserver=null;
function restoreState(){const q=new URLSearchParams(location.search),lv=q.get("lv"),r=q.get("r");state.level=["snorkel","owd","aowd"].includes(lv)?lv:null;state.region=REGIONS.has(r)?r:null}
function syncUrl(){const q=new URLSearchParams();if(state.level)q.set("lv",state.level);if(state.region)q.set("r",state.region);history.replaceState(null,"",location.pathname+(q.size?`?${q}`:"")+location.hash)}
function updateControls(){document.querySelectorAll("[data-filter-level]").forEach(b=>b.classList.toggle("active",(b.dataset.filterLevel||null)===state.level));document.getElementById("region").value=state.region||"";document.getElementById("clearFilters").classList.toggle("show",Boolean(state.level||state.region))}
function allowedLevels(){return state.level?LEVEL_ORDER.slice(0,LEVEL_ORDER.indexOf(state.level)+1):LEVEL_ORDER}
function matches(c){return allowedLevels().includes(c.level)&&(!state.region||c.spots.some(id=>regionBySpot.get(id)===state.region))}
function visual(c){if(c.img)return `<img src="${esc(c.img)}" alt="" loading="lazy">`;const key=c.svg||c.id;return `<svg viewBox="0 0 100 100" role="img" aria-label="${esc(c.name)}插畫"><use href="../assets/creatures.svg#${esc(key)}"></use></svg>`}
function spotsSummary(c){const n=c.spots.map(id=>spotById.get(id)?.name).filter(Boolean);return !n.length?"未指定潛點":n.length<=2?n.join("、"):`${n.slice(0,2).join("、")}等 ${n.length} 處`}
function cardHtml(c){const i=LEVEL_INFO[c.level];return `<button class="creature-card" type="button" data-creature="${esc(c.id)}" aria-label="查看${esc(c.name)}詳細資料"><span class="art-panel" data-level="${c.level}">${visual(c)}<span class="level-badge mono">${i.badge}</span></span><span class="card-body"><span class="card-name">${esc(c.name)}</span><span class="card-en mono">${esc(c.en)}</span><span class="card-meta">${esc(c.kind)} · ${esc(c.depth)}</span><span class="card-spots">${esc(spotsSummary(c))}</span></span></button>`}
function render(){const f=creatures.filter(matches),sections=document.getElementById("sections");sections.innerHTML=LEVEL_ORDER.map(level=>{const rows=f.filter(c=>c.level===level),i=LEVEL_INFO[level];return rows.length?`<section class="level-section" id="level-${level}" data-section="${level}"><div class="section-title"><span class="depth-label mono">${i.depth}</span><h2>${i.title}</h2></div><p class="section-desc">${i.desc}</p><div class="creature-grid">${rows.map(cardHtml).join("")}</div></section>`:""}).join("");document.getElementById("resultCount").innerHTML=`符合 <strong>${f.length}</strong> / ${creatures.length} 種`;document.getElementById("emptyState").classList.toggle("show",!f.length);syncUrl();updateControls();observeSections()}
function observeSections(){sectionObserver?.disconnect();sectionObserver=new IntersectionObserver(es=>{const v=es.filter(e=>e.isIntersecting).sort((a,b)=>Math.abs(a.boundingClientRect.top)-Math.abs(b.boundingClientRect.top))[0];if(v)setRail(v.target.dataset.section)},{rootMargin:"-18% 0px -60% 0px",threshold:0});document.querySelectorAll("[data-section]").forEach(el=>sectionObserver.observe(el));const first=document.querySelector("[data-section]");if(first)setRail(first.dataset.section)}
function setRail(level){document.querySelectorAll(".rail-mark").forEach(b=>b.classList.toggle("active",b.dataset.railLevel===level))}function clearFilters(){state.level=null;state.region=null;render()}
function dialogHtml(c){const i=LEVEL_INFO[c.level],links=c.spots.map(id=>spotById.get(id)?`<a class="spot-link" href="../spots/?focus=${encodeURIComponent(id)}">${esc(spotById.get(id).name)}</a>`:"").join("");return `<div class="art-panel" data-level="${c.level}">${visual(c)}<span class="level-badge mono">${i.badge}</span></div><div class="dialog-content"><h2 class="dialog-name" id="dialogName">${esc(c.name)}</h2><div class="dialog-en mono">${esc(c.en)}</div><div class="dialog-meta">${esc(c.kind)} · ${esc(c.depth)} · ${esc(levels[c.level]||i.title)}</div><section class="detail-block"><h3>牠是誰</h3><p>${esc(c.trait)}</p></section><section class="detail-block"><h3>在哪看得到</h3><p>${esc(c.where)}${c.warn?'<span class="review">⚠️ 需覆核</span>':''}</p></section><section class="detail-block"><h3>怎麼跟牠相處</h3><p class="tip-box">${esc(c.tip)}</p></section><section class="detail-block"><h3>在這些潛點遇得到</h3><div class="spot-chips">${links||'<span class="no-spots">目前沒有指定潛點</span>'}</div></section></div>`}
function openCreature(id,{fromHash=false}={}){const c=creatures.find(x=>x.id===id);if(!c)return;const layer=document.getElementById("modalLayer");currentCreature=c;if(!fromHash)lastTrigger=document.activeElement?.closest?.(".creature-card")||null;document.getElementById("dialogBody").innerHTML=dialogHtml(c);layer.classList.add("open");layer.setAttribute("aria-hidden","false");document.body.classList.add("modal-open");if(location.hash!==`#${c.id}`)history.pushState(null,"",location.pathname+location.search+`#${c.id}`);requestAnimationFrame(()=>document.querySelector(".modal-close").focus())}
function closeCreature({fromHash=false}={}){if(!currentCreature)return;document.getElementById("modalLayer").classList.remove("open");document.getElementById("modalLayer").setAttribute("aria-hidden","true");document.body.classList.remove("modal-open");currentCreature=null;if(!fromHash&&location.hash)history.replaceState(null,"",location.pathname+location.search);lastTrigger?.focus();lastTrigger=null}
function handleHash(){const id=decodeURIComponent(location.hash.slice(1))||new URLSearchParams(location.search).get("id");if(id&&creatures.some(c=>c.id===id))openCreature(id,{fromHash:true});else if(currentCreature)closeCreature({fromHash:true})}
document.querySelectorAll("[data-filter-level]").forEach(b=>b.addEventListener("click",()=>{state.level=b.dataset.filterLevel||null;render()}));document.getElementById("region").addEventListener("change",e=>{state.region=e.target.value||null;render()});document.getElementById("clearFilters").addEventListener("click",clearFilters);document.querySelector("[data-clear]").addEventListener("click",clearFilters);document.querySelectorAll(".rail-mark").forEach(b=>b.addEventListener("click",()=>document.getElementById(`level-${b.dataset.railLevel}`)?.scrollIntoView({behavior:"smooth"})));document.getElementById("sections").addEventListener("click",e=>{const card=e.target.closest("[data-creature]");if(card)openCreature(card.dataset.creature)});document.querySelector(".modal-close").addEventListener("click",()=>closeCreature());document.getElementById("modalLayer").addEventListener("click",e=>{if(e.target===e.currentTarget)closeCreature()});
addEventListener("keydown",e=>{if(e.key==="Escape"&&currentCreature)closeCreature();if(e.key==="Tab"&&currentCreature){const nodes=[...document.getElementById("dialog").querySelectorAll('button,a[href],[tabindex]:not([tabindex="-1"])')];if(!nodes.length)return;const first=nodes[0],last=nodes.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});addEventListener("hashchange",handleHash);
restoreState();updateControls();Promise.all([fetch("../creatures.json").then(r=>{if(!r.ok)throw new Error("creatures.json");return r.json()}),fetch("../spots.json").then(r=>{if(!r.ok)throw new Error("spots.json");return r.json()})]).then(([cd,sd])=>{creatures=cd.creatures;levels=cd.levels;spotById=new Map(sd.spots.map(s=>[s.id,s]));regionBySpot=new Map(sd.spots.map(s=>[s.id,s.region]));render();handleHash()}).catch(()=>{document.getElementById("sections").innerHTML='<div class="load-error">目前無法讀取生物資料，請稍後再試。</div>';document.getElementById("resultCount").textContent="載入失敗"});
</script>
</body>
</html>
